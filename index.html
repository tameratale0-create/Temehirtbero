<!doctype html>
<html lang="am">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <script>
      // 1. Intercept console.error to swallow any Vite HMR / WebSocket disconnect noise
      const _origError = console.error;
      console.error = function(...args) {
        const str = args.map(a => (typeof a === 'object' && a !== null ? (a.message || a.toString()) : String(a))).join(' ');
        if (
          str.includes('WebSocket') ||
          str.includes('closed without opened') ||
          str.includes('vite:ws') ||
          str.includes('[vite] failed to connect')
        ) {
          return;
        }
        _origError.apply(console, args);
      };

      // 2. Mock WebSocket for Vite HMR since HMR is disabled in this environment
      (function() {
        function MockHmrSocket(url, protocols) {
          this.readyState = 1; // WebSocket.OPEN
          this.url = url || '';
          this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || 'vite-hmr');
          this.bufferedAmount = 0;
          this.extensions = '';
          this.binaryType = 'blob';
          this.onopen = null;
          this.onclose = null;
          this.onerror = null;
          this.onmessage = null;
          this._listeners = { open: [], message: [], close: [], error: [] };

          setTimeout(() => {
            const ev = new Event('open');
            (this._listeners.open || []).forEach(fn => { try { fn(ev); } catch(_) {} });
            if (typeof this.onopen === 'function') {
              try { this.onopen(ev); } catch(_) {}
            }
          }, 0);
        }

        MockHmrSocket.prototype.addEventListener = function(type, listener) {
          if (!this._listeners[type]) this._listeners[type] = [];
          this._listeners[type].push(listener);
          if (type === 'open' && this.readyState === 1) {
            setTimeout(() => {
              try { listener(new Event('open')); } catch(_) {}
            }, 0);
          }
        };

        MockHmrSocket.prototype.removeEventListener = function(type, listener) {
          if (this._listeners[type]) {
            this._listeners[type] = this._listeners[type].filter(l => l !== listener);
          }
        };

        MockHmrSocket.prototype.dispatchEvent = function() { return true; };
        MockHmrSocket.prototype.send = function() {};
        MockHmrSocket.prototype.close = function() {
          this.readyState = 3; // WebSocket.CLOSED
        };

        MockHmrSocket.CONNECTING = 0;
        MockHmrSocket.OPEN = 1;
        MockHmrSocket.CLOSING = 2;
        MockHmrSocket.CLOSED = 3;

        // Replace window.WebSocket unconditionally to prevent Vite client from opening failing socket
        window.WebSocket = MockHmrSocket;
      })();

      // 3. Catch any global window errors or unhandled rejections related to WebSocket
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        const s = String(msg || '') + ' ' + (error ? (error.message || '') : '');
        if (
          s.includes('WebSocket') ||
          s.includes('closed without opened') ||
          s.includes('vite:ws') ||
          (url && String(url).includes('@vite/client'))
        ) {
          return true;
        }
      };

      window.onunhandledrejection = function(e) {
        const s = String(e.reason?.message || e.reason || '');
        if (
          s.includes('WebSocket') ||
          s.includes('closed without opened') ||
          s.includes('vite:ws')
        ) {
          e.preventDefault();
          return true;
        }
      };

      window.addEventListener('error', function(e) {
        const msg = e.message || (e.error && e.error.message) || '';
        if (
          msg.includes("reading 'send'") ||
          msg.includes('WebSocket') ||
          msg.includes('closed without opened') ||
          msg.includes('vite:ws') ||
          (e.filename && e.filename.includes('@vite/client'))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        const msg = (e.reason && (e.reason.message || e.reason.toString())) || '';
        if (
          msg.includes("reading 'send'") ||
          msg.includes('WebSocket') ||
          msg.includes('closed without opened') ||
          msg.includes('vite:ws')
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
