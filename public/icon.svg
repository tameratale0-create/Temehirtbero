<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="ethFlag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="33%" stop-color="#16a34a" />
      <stop offset="33%" stop-color="#facc15" />
      <stop offset="66%" stop-color="#facc15" />
      <stop offset="66%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Base Circle Background -->
  <rect width="512" height="512" rx="110" fill="#022c22" />
  <circle cx="256" cy="256" r="236" fill="url(#bgGlow)" stroke="#facc15" stroke-width="10" stroke-opacity="0.9" />

  <!-- Tricolor Outer Ring Accent -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#ethFlag)" stroke-width="8" stroke-dasharray="14 7" opacity="0.8" />

  <!-- Inner Seal Ring -->
  <circle cx="256" cy="256" r="185" fill="#064e3b" stroke="#eab308" stroke-width="6" />

  <!-- Sun Rays of Enlightenment -->
  <g opacity="0.25" stroke="#fef08a" stroke-width="4">
    <line x1="256" y1="110" x2="256" y2="70" />
    <line x1="330" y1="125" x2="355" y2="90" />
    <line x1="390" y1="170" x2="425" y2="150" />
    <line x1="182" y1="125" x2="157" y2="90" />
    <line x1="122" y1="170" x2="87" y2="150" />
  </g>

  <!-- Open Book of Knowledge -->
  <path d="M 170 330 Q 256 310 256 360 Q 256 310 342 330 L 352 240 Q 256 220 256 265 Q 256 220 160 240 Z" fill="#ffffff" stroke="#0f172a" stroke-width="4" />
  <path d="M 256 265 L 256 360" stroke="#047857" stroke-width="5" />
  <!-- Book page lines -->
  <line x1="185" y1="265" x2="240" y2="280" stroke="#047857" stroke-width="3" opacity="0.7" stroke-linecap="round" />
  <line x1="185" y1="285" x2="240" y2="300" stroke="#047857" stroke-width="3" opacity="0.7" stroke-linecap="round" />
  <line x1="185" y1="305" x2="240" y2="320" stroke="#047857" stroke-width="3" opacity="0.7" stroke-linecap="round" />
  <line x1="272" y1="280" x2="327" y2="265" stroke="#047857" stroke-width="3" opacity="0.7" stroke-linecap="round" />
  <line x1="272" y1="300" x2="327" y2="285" stroke="#047857" stroke-width="3" opacity="0.7" stroke-linecap="round" />
  <line x1="272" y1="320" x2="327" y2="305" stroke="#047857" stroke-width="3" opacity="0.7" stroke-linecap="round" />

  <!-- Torch of Education & Enlightenment -->
  <path d="M 244 260 L 268 260 L 262 205 L 250 205 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3" />
  <ellipse cx="256" cy="205" rx="14" ry="6" fill="#facc15" stroke="#78350f" stroke-width="2" />
  <!-- Flames -->
  <path d="M 256 125 C 275 155 285 180 270 200 C 265 190 260 185 256 185 C 252 185 247 190 242 200 C 227 180 237 155 256 125 Z" fill="#ef4444" />
  <path d="M 256 145 C 268 165 272 182 264 195 C 261 188 258 185 256 185 C 254 185 251 188 248 195 C 240 182 244 165 256 145 Z" fill="#facc15" />

  <!-- Golden Laurel Wreath Leaves on Sides -->
  <!-- Left Wreath -->
  <path d="M 140 280 C 130 240 145 190 175 160 C 170 175 165 200 172 230 C 155 245 145 260 140 280 Z" fill="url(#goldGrad)" opacity="0.9" />
  <path d="M 125 315 C 120 285 130 255 145 235 C 145 255 150 275 160 295 C 145 305 135 310 125 315 Z" fill="url(#goldGrad)" opacity="0.9" />
  <!-- Right Wreath -->
  <path d="M 372 280 C 382 240 367 190 337 160 C 342 175 347 200 340 230 C 357 245 367 260 372 280 Z" fill="url(#goldGrad)" opacity="0.9" />
  <path d="M 387 315 C 392 285 382 255 367 235 C 367 255 362 275 352 295 C 367 305 377 310 387 315 Z" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Bottom Banner with Amharic / Shashemene Text -->
  <path d="M 140 405 C 200 390 312 390 372 405 L 360 445 C 310 432 202 432 152 445 Z" fill="#1e293b" stroke="#eab308" stroke-width="3" />
  <text x="256" y="426" text-anchor="middle" font-family="'Noto Sans Ethiopic', 'Inter', sans-serif" font-size="20" font-weight="bold" fill="#facc15">ሻሸመኔ ትምህርት ቢሮ</text>

  <!-- Top Ribbon Star -->
  <polygon points="256,70 262,86 280,87 266,98 271,115 256,104 241,115 246,98 232,87 250,86" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
</svg>
